<!doctype html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta
      name="description"
      content="Femutsu - bu O'zbekistondagi birinchilardan bo'lgan tekin va sifatli anime ko'rish uchun platforma"
    />
  <title>Femutsu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <header class="site-header">
    <div class="wrap">
      <a href="/" class="logo">
        <img src="/assets/logo.png" alt="Femutsu logo" class="logo-img">
        <span class="logo-text">Femutsu</span>
      </a>

      <nav class="main-nav">
        <a href="#" class="active">Anime</a>
        <a href="#">Ongoing</a>
        <a href="#">Bizning jamoa</a>
      </nav>

      <div class="header-actions">
        <a href="/login" class="btn-signin" id="authButton">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" />
            <path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span class="label">Kirish</span>
        </a>
        <div class="func_buts"">
          <button class=" icon-btn" aria-label="Qidiruv">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
            <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          </button>
          <button class="icon-btn" aria-label="Mavzu">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2" />
              <path
                d="M12 2v2M12 20v2M4 12H2M22 12h-2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <button class="hamburger" id="hamburgerBtn" aria-label="Меню" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>

    <nav class="mobile-nav" id="mobileNav">
      <a href="#">Anime</a>
      <a href="#">Ongoing</a>
      <a href="#">Bizning jamoa</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <div class="section-head">
          <p class="section-eyebrow">Mavsum</p>
          <h1 class="section-title">Yozgi anime mavsumi</h1>
        </div>

        <div class="carousel-row">
          <button class="carousel-btn prev" data-target="hero-track" aria-label="Ortga">‹</button>
          <div class="carousel-track" id="hero-track"></div>
          <button class="carousel-btn next" data-target="hero-track" aria-label="Oldinga">›</button>
        </div>
      </div>
    </section>

    <section class="content-section">
      <div class="wrap">
        <div class="section-head">
          <p class="section-eyebrow">Katalog</p>
          <h2 class="section-title">Saytda yangi</h2>
        </div>
        <div class="grid-cards" id="new-grid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-links">
        <a href="#">Rozilik</a>
        <a href="#">Конфиденциальность</a>
        <a href="#">Egalar uchun</a>
      </div>
      <p class="footer-note footer-contact">Mualliflik huquqi bilan— <a
          href="mailto:info@femutsu.me">info@femutsu.me</a></p>
      <p class="footer-note">© 2026 Femutsu</p>
    </div>
  </footer>

  <script src="/js/app.js"></script>

</body>

</html>
